[package]
name = "libea-audio"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Standalone pure-Rust EA SCHl/ASF/EA-XA/EACS audio codec and stream decoder"
keywords = ["ea", "schl", "adpcm", "audio", "ps1"]
categories = ["multimedia::audio", "emulators", "no-std"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]

[dev-dependencies]

[[bench]]
name = "bench_audio"
harness = false
